name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Types (mypy strict)
        run: mypy app
      - name: Sécurité statique
        run: bandit -q -r app -c pyproject.toml
      - name: Vulnérabilités des dépendances
        run: pip-audit --skip-editable
      - name: Tests (couverture >= 85 %)
        run: pytest --cov=app --cov-report=term-missing

  fiscal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r fiscal-engine/requirements.txt pytest httpx2 && pip install -e "backend[dev]"
      - name: Tests du moteur fiscal (OpenFisca réel)
        working-directory: fiscal-engine
        run: pytest test_engine.py -q
      - name: Intégration backend <-> moteur réel
        run: |
          cd fiscal-engine && FISCAL_TOKEN=ci uvicorn engine:app --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/health | grep -q '"ok"' && break; sleep 1; done
          cd backend && FISCAL_ENGINE_URL=http://127.0.0.1:8765 FISCAL_TOKEN=ci pytest -m openfisca -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh integrations/hermes/install.sh

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && bash scripts/gen-secrets.sh
      - run: docker compose build
        env: { DOCKER_BUILDKIT: "1" }
      - name: Scan des images (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: bank-api:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
