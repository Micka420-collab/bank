[project]
name = "bank"
version = "0.1.0"
description = "Bank — cockpit financier personnel auto-hébergé : comptes, budget, aides de l'État, patrimoine."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "mcp>=2.3,<3",  # serveur MCP des agents IA (API MCPServer de la v2)
  "pypdf>=6.21,<7",  # lecture des documents officiels (texte seulement) ; 6.21 : plafonds configurables (apply_configuration)
  "icalendar>=6,<7",  # planning de travail (agenda iCal), développement des répétitions via python-dateutil
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
  "openfisca: nécessite openfisca-france installé (moteur fiscal réel)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PIE", "PT", "RET", "DTZ", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "PLR2004", "DTZ", "S105", "S106", "PT018", "PT011", "E501"]
"../fiscal-engine/test_*.py" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["segno.*", "pyotp.*", "icalendar.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
