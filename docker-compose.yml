# Bank sur nimbus — 3 conteneurs, 4 réseaux, zéro port exposé hors du frontal.
#
#   ton reverse proxy TLS ──> web (nginx :8080) ──app──> api (FastAPI) ──fiscal──> fiscal (OpenFisca)
#                                                          └──egress──> api.enablebanking.com, conso.boris.sh,
#                                                                      openrouter.ai (assistant, si une clé est enregistrée)
#
# * « fiscal » est sur un réseau interne : aucun accès Internet, ta situation fiscale ne sort jamais.
# * « app » est interne : seul nginx parle à l'API.
# * Facultatif (profil « whatsapp ») : la passerelle WhatsApp par QR code, sur un 5e réseau interne avec l'API.
# * Tous les conteneurs : non-root, système de fichiers en lecture seule, aucune capability, pas d'escalade
#   (seule exception : « whatsapp-bridge-init », root le temps d'un chown du volume de la passerelle, sans réseau).

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  web:
    <<: *hardening
    build: ./frontend
    image: bank-web:latest
    ports:
      - "${BANK_BIND:-127.0.0.1}:${BANK_PORT:-8088}:8080"
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    networks: [edge, app]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 64m, pids: 64 } }

  api:
    <<: *hardening
    build: ./backend
    image: bank-api:latest
    env_file: .env
    environment:
      BANK_ENV: prod
      BANK_DATABASE_URL: sqlite:////data/bank.db
      BANK_MASTER_KEY_FILE: /run/secrets/master_key
      BANK_SETUP_TOKEN_FILE: /run/secrets/setup_token
      BANK_FISCAL_ENGINE_URL: http://fiscal:8001
      BANK_FISCAL_ENGINE_TOKEN_FILE: /run/secrets/fiscal_token
    secrets: [master_key, setup_token, fiscal_token, enablebanking_key]
    group_add: ["10010"]  # groupe « bank-secrets » : lecture des fichiers de ./secrets (mode 640)
    volumes:
      - bank-data:/data
      # Second emplacement des sauvegardes chiffrées (BANK_BACKUP_REMOTE_DIR=/backups-usb) : un disque ou un NAS monté.
      # - /mnt/usb/bank:/backups-usb
    # /tmp plus grand : un dépôt de plusieurs documents au coffre transite par là (40 Mo au plus).
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [app, fiscal, egress, whatsapp]
    depends_on:
      fiscal: { condition: service_healthy }
    deploy:
      # La lecture des photos (OCR) tourne dans des processus enfants bornés : de la marge au-delà de l'API.
      resources: { limits: { memory: 1g, pids: 128 } }

  fiscal:
    <<: *hardening
    build: ./fiscal-engine
    image: bank-fiscal:latest
    environment:
      FISCAL_TOKEN_FILE: /run/secrets/fiscal_token
    secrets: [fiscal_token]
    group_add: ["10010"]
    networks: [fiscal]
    deploy:
      resources: { limits: { memory: 768m, pids: 64 } }

  # WhatsApp par QR code (ton numéro, appareil lié) — facultatif : « docker compose --profile whatsapp up -d ».
  # Passerelle GOWA (go-whatsapp-web-multidevice, MIT), épinglée. Aucun port publié : Bank la joint sur le réseau
  # interne « whatsapp » (http://whatsapp-bridge:3000) et elle rappelle l'API (webhook signé) ; elle ne sort que
  # vers les serveurs de WhatsApp. Ses identifiants : secrets/whatsapp-bridge.env (README › Messageries).
  # Le volume whatsapp-storages contient la session ET l'historique que la passerelle garde : sensible (SECURITY.md).
  whatsapp-bridge:
    <<: *hardening
    profiles: [whatsapp]
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0@sha256:7739f074685e84b6587c15c289a689f68c3edc2cf5a44c2ac674260c338114a1
    command: ["rest"]
    user: "65532:65532"  # l'image tourne en root par défaut : pas ici
    depends_on:
      whatsapp-bridge-init: { condition: service_completed_successfully }
    # APP_BASIC_AUTH=bank:… et WHATSAPP_WEBHOOK_SECRET=… (Bank refuse une passerelle qui répond sans mot de passe).
    env_file: [{ path: ./secrets/whatsapp-bridge.env, required: false }]
    environment:
      APP_HOST: 0.0.0.0  # dans le conteneur ; seul le réseau interne y mène
      APP_PORT: "3000"
      APP_OS: Bank
      APP_UI_ENABLED: "false"
      APP_UI_AUTO_UPDATE: "false"
      APP_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:1"  # vide = toutes les origines : on n'en autorise aucune
      MCP_ENABLED: "false"  # /mcp donnerait la main sur tout le compte
      WHATSAPP_WEBHOOK: http://api:8000/api/channels/whatsapp_qr/webhook
      WHATSAPP_WEBHOOK_EVENTS: message
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us,@newsletter,@broadcast,status@broadcast"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
      WHATSAPP_IGNORE_STATUS_MEDIA: "true"
      WHATSAPP_AUTO_MARK_READ: "false"
      WHATSAPP_PRESENCE_ON_CONNECT: unavailable
      WHATSAPP_PRESENCE_PULSE_ENABLED: "false"
    volumes:
      - whatsapp-storages:/app/storages
    # Les QR codes et fichiers de passage : en mémoire, rien à garder.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/statics:size=32m,uid=65532,gid=65532,mode=0700
    networks: [whatsapp, egress]
    deploy:
      resources: { limits: { memory: 192m, pids: 64 } }

  # Une seule fois avant la passerelle : rend son volume à l'utilisateur 65532 (un volume neuf appartient à root).
  # Seule capability : CHOWN ; aucun réseau ; s'arrête aussitôt.
  whatsapp-bridge-init:
    profiles: [whatsapp]
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0@sha256:7739f074685e84b6587c15c289a689f68c3edc2cf5a44c2ac674260c338114a1
    entrypoint: ["chown", "-R", "65532:65532", "/app/storages"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    volumes:
      - whatsapp-storages:/app/storages

networks:
  # Sous-réseau fixe : nginx ne croit X-Forwarded-For que depuis sa passerelle 172.31.250.1 (frontend/nginx.conf).
  edge:
    ipam:
      config: [{ subnet: 172.31.250.0/29, gateway: 172.31.250.1 }]
  app: { internal: true }
  fiscal: { internal: true }
  whatsapp: { internal: true }  # API <-> passerelle WhatsApp (QR), rien d'autre
  egress: {}

volumes:
  bank-data: {}
  whatsapp-storages: {}

secrets:
  master_key: { file: ./secrets/master_key }
  setup_token: { file: ./secrets/setup_token }
  fiscal_token: { file: ./secrets/fiscal_token }
  # Clé privée de ton application Enable Banking (fichier vide tant que la synchro n'est pas configurée).
  enablebanking_key: { file: ./secrets/enablebanking.pem }
