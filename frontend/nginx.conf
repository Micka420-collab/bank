# nginx frontal de Bank : sert l'application, relaie /api vers le backend, impose les en-têtes de sécurité.
# Le TLS est terminé en amont par ton reverse proxy de nimbus (Caddy/Traefik/NPM).

limit_req_zone $binary_remote_addr zone=bank_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bank_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bank_mcp:10m rate=5r/s;

# Vraie IP du client (ex. HERMÈS sur 192.168.1.112) transmise par ton reverse proxy TLS. Indispensable pour la
# liste d'adresses autorisées des jetons d'agent. On ne croit l'en-tête que s'il vient de la passerelle du
# réseau « edge » (sous-réseau fixé dans docker-compose.yml : c'est par là qu'arrive le port publié sur
# 127.0.0.1) — jamais d'un autre conteneur ni d'un client du LAN.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.31.250.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Politique de contenu stricte : uniquement nos propres fichiers, aucun inline, aucun tiers.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Lectures de session faites à chaque ouverture de l'application (et la déconnexion) : aucun secret n'y
    # est soumis, donc limite générale — sinon trois rechargements d'affilée afficheraient « serveur en panne ».
    # Ce bloc doit rester AVANT le suivant : nginx retient la première expression régulière qui correspond.
    location ~ ^/api/(auth/me|auth/logout|setup/status)$ {
        limit_req zone=bank_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    # Authentification (mot de passe, code, jeton d'installation, export) : limite stricte par IP, en plus de
    # celle du backend.
    location ~ ^/api/(auth|setup|export) {
        limit_req zone=bank_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    # Dépôt au coffre-fort : plusieurs photos ou PDF d'un coup (taille revérifiée par l'API), transmis au fil de
    # l'eau sans tampon disque (le cache nginx est un tmpfs de 32 Mo).
    location = /api/vault/upload {
        limit_req zone=bank_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 41m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    location /api/ {
        limit_req zone=bank_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    # Serveur MCP des agents IA (HERMÈS). Jeton vérifié à chaque requête par l'API ; ici, débit et taille bornés.
    location = /mcp {
        limit_req zone=bank_mcp burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    # Fichiers versionnés par hash : cache long et immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
